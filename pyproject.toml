[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-analysis"
version = "0.1.0"
description = "Cross-asset market intelligence agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Watson" }]
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "voyageai>=0.2.4",
    "chromadb>=0.5.0",
    "langfuse>=3.0.0,<4.0.0",
    "mcp>=1.27.2,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.0",
    "mypy>=2.0.0",
]


[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit. Without a select list the enforced ruleset is whatever the
# installed ruff version defaults to, which means upgrading the tool
# silently changes the gate. Chosen, not inherited.
select = [
    "E",      # pycodestyle errors
    "W291",   # trailing whitespace
    "W293",   # blank line with whitespace
    "F",      # pyflakes — unused imports, undefined names
    "I",      # isort — import ordering
    "UP",     # pyupgrade — modern syntax for the target version
    "B",      # bugbear — likely bugs
    "SIM",    # simplify — readability
    "ISC",    # implicit string concat — catches missing commas in lists
    "RUF",    # ruff-specific
    "S",      # bandit — security
    "BLE",    # blind except
    "PYI",    # type annotation style
]

# W291 and W293 only, not the whole W group. W292 fires on 81 of 86
# files, since not ending files with a newline is the existing house
# style here, and enabling it would be an 81-file churn commit.
#
# The blank-line rules that would catch a constant or a function
# separated by one line instead of two are E301 to E306, which ruff
# implements under --preview only. Pinning the gate to a preview flag
# trades one source of drift for another, so those stay off and blank
# line counts stay a review matter.

ignore = [
    # StrEnum would be the modern form, but str+Enum stringification
    # reaches committed eval artefacts and Langfuse span attributes.
    # Changing it risks making new runs incomparable with the baseline
    # committed in Block 1.7. Revisit only with a serialisation test.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Observability must never raise into the agent's critical path, so the
# emitter absorbs every exception by design. The one place where
# try/except/pass is correct rather than a smell.
"aw_analysis/obs/emitter.py" = ["S110", "BLE001", "S101"]

# Span-attribute key names. S105 pattern-matches on "TOKEN" in the
# variable name; these are Langfuse telemetry field names, not secrets.
"aw_analysis/obs/attributes.py" = ["S105"]

# The eval layer must not crash mid-run on one bad case; the runner
# catches broadly and records the failure as a result.
"evals/runner/run.py" = ["BLE001"]

# Chroma collection deletion where the collection may not exist.
"aw_analysis/rag/store.py" = ["S110", "BLE001"]

# input_schema is a class attribute because the Tool base class contract
# requires it; to_anthropic_param() reads it. RUF012 wants ClassVar,
# which would be correct but changes the base class shape. Deferred.
"aw_analysis/tools/*.py" = ["RUF012"]

# The classifier prompt's few-shot examples are single-line JSON,
# deliberately, because the format models the expected output shape.
# Content the model reads is not subject to code formatting rules.
"aw_analysis/agent/decomposer.py" = ["E501"]

# ❯ is a deliberate prompt glyph in the CLI, not an ambiguous typo.
"aw_analysis/cli/main.py" = ["RUF001"]

# Prompt bodies are model input and rendered bytes, not code. Stripping
# whitespace inside a version's string literal changes that version's
# rendered prompt, and prompt versions are immutable audit artefacts.
# Concretely: the Block 6 comparison pairs a sealed v2.5.0 run against a
# v2.6.0 run, and both must be measured against identical v2.5.0 text.
# One of the two offenders is the documented _tool_selection paste
# artefact, a shell prompt that ended up inside the prompt string. It is
# preserved deliberately. Same argument as the judge rubrics and attack
# payloads below.
"aw_analysis/prompts/system.py" = ["W291", "W293"]

# pytest's entire idiom is bare assert; S101 exists because -O strips
# them, which does not apply to a test run.
"tests/**" = ["S101"]

# Judge rubrics and calibration reference answers are model inputs, and
# golden case definitions are fixed test data. Their wording is the
# instrument being measured, so rewrapping them changes what is
# measured. Same argument as the decomposer few-shots above.
"evals/grader/judge.py" = ["E501"]
"evals/calibration/*.py" = ["E501"]
"evals/golden/**" = ["E501"]

# Attack payloads and the judge's category rubrics are the red-team
# instrument. Rewrapping an attack payload changes the attack. Scoped to
# the two data-carrying modules only; main.py is report formatting and
# gets wrapped rather than exempted.
"evals/redteam/attacks.py" = ["E501"]
"evals/redteam/grader.py" = ["E501"]

# main.py is ANSI-heavy terminal formatting. Its long lines are long in
# source, not on screen: a single Fore.CYAN or Style.RESET_ALL costs
# around thirty source characters and zero columns. E501 counts source
# characters as a proxy for readable width, and that proxy does not hold
# here. Permanent, and a different argument from the two above.

# count_tokens and the debug block formatter are both informational: if
# they fail the correct behaviour is to carry on without summarisation
# or without a pretty rendering, not to kill the user's turn. Same
# pattern as obs/emitter.py.
"aw_analysis/agent/conversation.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["aw_analysis", "evals"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "silent"
# Ratcheted. Modules listed in files= are checked and must pass; the rest
# are read for types but their own errors are not reported. Add modules
# here as they are cleaned rather than switching the whole package on and
# living with a permanently red gate.
files = ["aw_analysis/tools/", "aw_analysis/client/"]

[[tool.mypy.overrides]]
# Tool subclasses narrow execute(**kwargs) to named parameters (ticker,
# query). Mypy is right that this breaks substitutability, but the
# narrowing is a deliberate runtime guard: ToolRegistry.dispatch calls
# execute(**tool_input) where tool_input is JSON the model produced, so
# a wrong key raises TypeError immediately instead of being swallowed.
# Widening to **kwargs to satisfy the checker would remove that guard.
#
# The correct fix is a Protocol rather than an ABC, since nothing holds
# a generic Tool and invents arguments — the registry always calls with
# that tool's own schema. Deferred; see KNOWN_ISSUES.md.
module = "aw_analysis.tools.*"
disable_error_code = ["override"]